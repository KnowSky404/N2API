services:
  n2api:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/n2api_database_url
      N2API_ADMIN_PASSWORD: ""
      N2API_ADMIN_PASSWORD_FILE: /run/secrets/n2api_admin_password
      N2API_ENCRYPTION_SECRET: ""
      N2API_ENCRYPTION_SECRET_FILE: /run/secrets/n2api_encryption_secret
    secrets:
      - n2api_database_url
      - n2api_admin_password
      - n2api_encryption_secret
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/n2api_postgres_password
    secrets:
      - n2api_postgres_password

secrets:
  n2api_database_url:
    file: ${N2API_DATABASE_URL_SOURCE_FILE:?N2API_DATABASE_URL_SOURCE_FILE is required}
  n2api_admin_password:
    file: ${N2API_ADMIN_PASSWORD_SOURCE_FILE:?N2API_ADMIN_PASSWORD_SOURCE_FILE is required}
  n2api_encryption_secret:
    file: ${N2API_ENCRYPTION_SECRET_SOURCE_FILE:?N2API_ENCRYPTION_SECRET_SOURCE_FILE is required}
  n2api_postgres_password:
    file: ${N2API_POSTGRES_PASSWORD_SOURCE_FILE:?N2API_POSTGRES_PASSWORD_SOURCE_FILE is required}
