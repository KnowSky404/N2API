services:
  n2api:
    environment:
      N2API_METRICS_BEARER_TOKEN: ""
      N2API_METRICS_BEARER_TOKEN_FILE: /run/secrets/n2api_metrics_bearer_token
    secrets:
      - n2api_metrics_bearer_token

secrets:
  n2api_metrics_bearer_token:
    file: ${N2API_METRICS_BEARER_TOKEN_SOURCE_FILE:?N2API_METRICS_BEARER_TOKEN_SOURCE_FILE is required}
